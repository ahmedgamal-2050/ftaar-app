services:
  postgres:
    image: postgres:16-alpine
    container_name: ftaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ftaar
      POSTGRES_PASSWORD: ftaar
      POSTGRES_DB: ftaar
    ports:
      - '5432:5432'
    volumes:
      - ftaar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ftaar -d ftaar']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ftaar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgres://ftaar:ftaar@postgres:5432/ftaar
      JWT_SECRET: local-dev-jwt-secret-do-not-use-in-prod
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
      BODY_LIMIT: 256kb
      RUN_SEED: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  ftaar_pg:
