name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ftaar
          POSTGRES_PASSWORD: ftaar
          POSTGRES_DB: ftaar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftaar -d ftaar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: '3000'
      LOG_LEVEL: silent
      DATABASE_URL: postgres://ftaar:ftaar@127.0.0.1:5432/ftaar
      JWT_SECRET: ci-jwt-secret-16x
      CORS_ORIGINS: http://localhost:3000
      BODY_LIMIT: 256kb
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma

      - run: npx nx format:check --base="origin/${{ github.event.pull_request.base.ref || 'master' }}"

      - run: npx nx run-many -t lint,typecheck,test,e2e,openapi -p backend,api-e2e --outputStyle=static

      - name: Production dependency audit (backend image graph)
        run: |
          npx nx run backend:prune --configuration=production
          npm audit --omit=dev --audit-level=high --prefix dist/apps/backend
