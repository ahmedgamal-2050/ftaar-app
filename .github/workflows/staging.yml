name: Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Staging URL
        run: |
          echo "Staging URL: ${STAGING_URL:-https://staging.ftaar.example}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.image.outputs.name }}:main" >> "$GITHUB_STEP_SUMMARY"
          echo "Start the host with RUN_SEED=true so the entrypoint migrates and seeds." >> "$GITHUB_STEP_SUMMARY"
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
